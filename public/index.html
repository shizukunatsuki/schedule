<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F8F7F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262931" media="(prefers-color-scheme: dark)">
<meta name="description" content="固定周课表：每天上午、下午、晚上各一节，六科间隔按节数均匀，整周全局显示，按今天高亮。">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌸%3C/text%3E%3C/svg%3E">
<title>一周二十一节</title>

<style>
:root{
  /* 空気系 / 日常系 tokens — bright diffused daylight, mostly white, colour only as gentle tints,
     thin tinted lines instead of black ones (色トレス), nothing that "hits".
     Six subjects, six hues; 桜 pink is the emotional centre and belongs to "today" alone.
     Each hue: soft fill / mark (borders & dots ≥3:1) / text (≥4.5:1), verified on white,
     on the page ground, on sunk and on its own soft, both themes. */
  --bg:#F8F7F9;
  --light1:rgba(252,214,226,.55);   /* morning pink, top-left */
  --light2:rgba(214,232,247,.6);    /* sky, top-right */
  --bokeh:rgba(255,255,255,.7);
  --surface:#FFFFFF;
  --sunk:#F3F2F5;
  --ink:#4A4652;
  --muted:#6A6574;
  --faint:#6E6878;
  --hair:#8F8899;
  --line:#E9E4EC;
  /* today = 桜 sakura */
  --pink:#A8416A;    --pink-mark:#C36286;   --pink-soft:#FCE6ED;
  /* subjects */
  --sky:#3D6E97;     --sky-mark:#4F87B8;    --sky-soft:#E2EFF9;     /* 数学 */
  --fuji:#5F4A93;    --fuji-mark:#8B72BE;   --fuji-soft:#ECE7F6;    /* 语文 */
  --honey:#7A5A12;   --honey-mark:#B3842A;  --honey-soft:#FFF3D6;   /* 历史 */
  --grass:#4C7541;   --grass-mark:#5E9049;  --grass-soft:#E8F3E1;   /* 政治 */
  --mint:#2F6B5C;    --mint-mark:#458E80;   --mint-soft:#DFF2EF;    /* 地理 */
  --coral:#95452B;   --coral-mark:#C06A4E;  --coral-soft:#FBE8E1;   /* 日语 */
  --shadow:120,90,110;
  /* one type scale (HIG: caption 11 / footnote 12 / subhead 13 / body 15 / headline 17 / title 22 / title-1 26 / large 30) */
  --fs-caption:11px; --fs-foot:12px; --fs-sub:13px; --fs-body:15px; --fs-head:17px; --fs-title:22px; --fs-title1:26px; --fs-large:30px;
  /* one radius scale */
  --r-lg:14px; --r-md:10px; --r-sm:6px; --r-xs:3px;
  /* one motion scale */
  --t-fast:.2s; --t-med:.3s; --ease:cubic-bezier(.25,.6,.3,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#262931;
    --light1:rgba(224,138,166,.10);
    --light2:rgba(127,176,220,.12);
    --bokeh:rgba(255,255,255,.04);
    --surface:#2E323B;
    --sunk:#22252C;
    --ink:#F1EEF3;
    --muted:#C6C0CC;
    --faint:#B9B2C0;
    --hair:#7F7A88;
    --line:#3E424C;
    --pink:#F2B3C6;    --pink-mark:#E08AA6;   --pink-soft:#4A3039;
    --sky:#A9CBEA;     --sky-mark:#7FB0DC;    --sky-soft:#25384A;
    --fuji:#C9B8EC;    --fuji-mark:#A78FD6;   --fuji-soft:#373050;
    --honey:#E8C87E;   --honey-mark:#D3A94F;  --honey-soft:#453A20;
    --grass:#B9DBA7;   --grass-mark:#8FC077;  --grass-soft:#2B3D27;
    --mint:#9FD8C6;    --mint-mark:#6FBFA9;   --mint-soft:#233B36;
    --coral:#EDB49C;   --coral-mark:#D68A6C;  --coral-soft:#4A3028;
    --shadow:0,0,0;
  }
}
:root[data-theme="dark"]{
  --bg:#262931;
  --light1:rgba(224,138,166,.10);
  --light2:rgba(127,176,220,.12);
  --bokeh:rgba(255,255,255,.04);
  --surface:#2E323B;
  --sunk:#22252C;
  --ink:#F1EEF3;
  --muted:#C6C0CC;
  --faint:#B9B2C0;
  --hair:#7F7A88;
  --line:#3E424C;
  --pink:#F2B3C6;    --pink-mark:#E08AA6;   --pink-soft:#4A3039;
  --sky:#A9CBEA;     --sky-mark:#7FB0DC;    --sky-soft:#25384A;
  --fuji:#C9B8EC;    --fuji-mark:#A78FD6;   --fuji-soft:#373050;
  --honey:#E8C87E;   --honey-mark:#D3A94F;  --honey-soft:#453A20;
  --grass:#B9DBA7;   --grass-mark:#8FC077;  --grass-soft:#2B3D27;
  --mint:#9FD8C6;    --mint-mark:#6FBFA9;   --mint-soft:#233B36;
  --coral:#EDB49C;   --coral-mark:#D68A6C;  --coral-soft:#4A3028;
  --shadow:0,0,0;
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(70% 38% at 0% 0%, var(--light1), transparent 70%),
    radial-gradient(60% 34% at 100% 0%, var(--light2), transparent 70%),
    radial-gradient(180px 180px at 88% 14%, var(--bokeh), transparent 70%),
    radial-gradient(110px 110px at 76% 6%, var(--bokeh), transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:var(--fs-body);line-height:1.6;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.mono{font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding:36px 20px 64px}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 6px 24px -18px rgba(var(--shadow),.35)}

/* ---------- masthead ---------- */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:14px}
.eyebrow{margin:0 0 6px;font-size:var(--fs-foot);font-weight:500;color:var(--muted)}
.eyebrow .spark{color:var(--pink-mark);margin-right:5px}
h1{margin:0;font-weight:600;font-size:clamp(28px,6.5vw,34px);line-height:1.15;letter-spacing:.02em}
.clockbox{text-align:right;flex:none}
.livetime{margin:0;font-size:var(--fs-title1);font-weight:500;line-height:1;color:var(--ink)}
.today{margin:6px 0 0;font-size:var(--fs-foot);color:var(--faint)}
.lede{margin:0 0 18px;color:var(--muted);font-size:var(--fs-sub)}
.lede .mono{color:var(--ink);font-weight:600}

/* ---------- subject hues ---------- */
.subj-math {--c-soft:var(--sky-soft);   --c-mark:var(--sky-mark);   --c-text:var(--sky)}
.subj-fuji {--c-soft:var(--fuji-soft);  --c-mark:var(--fuji-mark);  --c-text:var(--fuji)}
.subj-honey{--c-soft:var(--honey-soft); --c-mark:var(--honey-mark); --c-text:var(--honey)}
.subj-grass{--c-soft:var(--grass-soft); --c-mark:var(--grass-mark); --c-text:var(--grass)}
.subj-mint {--c-soft:var(--mint-soft);  --c-mark:var(--mint-mark);  --c-text:var(--mint)}
.subj-coral{--c-soft:var(--coral-soft); --c-mark:var(--coral-mark); --c-text:var(--coral)}

/* ---------- the week grid ---------- */
.board{padding:16px 18px 14px}
.week{width:100%;border-collapse:separate;border-spacing:5px 6px;table-layout:fixed}
.week th,.week td{padding:0;font-weight:400}
.week caption{caption-side:top}
.corner{width:112px}
.dayhead{
  text-align:center;vertical-align:middle;padding:7px 2px;border-radius:var(--r-md);
  border:1px solid transparent;font-size:var(--fs-sub);font-weight:600;color:var(--muted);
  transition:background var(--t-med) var(--ease),color var(--t-med) var(--ease),border-color var(--t-med) var(--ease);
}
.dayhead .dshort{display:none}
.dayhead .dnow{display:none}
.dayhead.today{background:var(--pink-soft);border-color:var(--pink-mark);color:var(--pink)}
.dayhead.today .dnow{
  display:inline-flex;align-items:center;gap:4px;margin-left:5px;
  font-size:var(--fs-caption);font-weight:600;color:var(--pink);vertical-align:1px;
}
.dayhead.today .dnow::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--pink-mark);flex:none;
  animation:breathe 2.6s ease-in-out infinite;
}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(195,98,134,.35)}50%{box-shadow:0 0 0 5px rgba(195,98,134,0)}}

.rowhead{text-align:left;vertical-align:middle;padding:0 8px 0 4px;width:112px}
.rowhead .pname{display:block;font-size:var(--fs-body);font-weight:600;line-height:1.3}
.rowhead .ptime{display:block;font-size:var(--fs-caption);color:var(--faint);line-height:1.4;white-space:nowrap}
.rowhead .plen{display:block;font-size:var(--fs-caption);color:var(--faint);line-height:1.4}

.tile{
  display:flex;align-items:center;justify-content:center;min-height:68px;padding:6px 4px;
  background:var(--c-soft);border:1px solid var(--c-mark);border-radius:var(--r-md);
  color:var(--c-text);font-size:var(--fs-head);font-weight:600;letter-spacing:.04em;
  transition:border-color var(--t-med) var(--ease),box-shadow var(--t-med) var(--ease);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.period-night .tile{min-height:56px}
.cell.today .tile{border-color:var(--pink-mark);box-shadow:inset 0 0 0 1px var(--pink-mark)}

.breakhead{width:112px;text-align:left;vertical-align:middle;padding:0 8px 0 4px}
.breakhead span{font-size:var(--fs-foot);font-weight:500;color:var(--faint)}
.breakband{
  display:flex;align-items:center;justify-content:center;min-height:28px;
  background:var(--sunk);border-radius:var(--r-sm);
  font-size:var(--fs-foot);color:var(--faint);letter-spacing:.02em;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}

/* ---------- legend & note ---------- */
.legend{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;margin:14px 2px 0;font-size:var(--fs-foot);color:var(--muted)}
.key{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c-mark)}
.kcount{font-weight:400;font-size:var(--fs-caption);color:var(--faint)}
.note{margin:12px 2px 0;font-size:var(--fs-foot);color:var(--faint)}

/* ---------- responsive ---------- */
@media (max-width:700px){
  .wrap{padding:26px 14px 52px}
  .board{padding:12px 12px 10px}
  .week{border-spacing:4px 5px}
  .corner,.rowhead,.breakhead{width:78px}
  .rowhead{padding:0 6px 0 2px}
  .rowhead .pname{font-size:var(--fs-sub)}
  .rowhead .plen{display:none}
  .tile{min-height:58px;font-size:var(--fs-sub)}
  .period-night .tile{min-height:48px}
  .livetime{font-size:var(--fs-title)}
  .lede{font-size:var(--fs-foot)}
}
@media (max-width:480px){
  .wrap{padding:22px 10px 44px}
  .board{padding:9px 8px 8px}
  .week{border-spacing:3px 4px}
  .corner,.rowhead,.breakhead{width:42px}
  .rowhead,.breakhead{padding:0 3px 0 1px}
  .rowhead .pname{font-size:var(--fs-foot)}
  .rowhead .ptime{display:none}
  .breakhead span{font-size:var(--fs-caption)}
  .dayhead{padding:5px 0;font-size:var(--fs-foot)}
  .dayhead .dfull{display:none}
  .dayhead .dshort{display:inline}
  .dayhead.today .dnow{display:none}
  .tile{min-height:46px;padding:4px 1px;font-size:var(--fs-foot);letter-spacing:0;border-radius:var(--r-sm)}
  .period-night .tile{min-height:40px}
  .breakband{min-height:22px;font-size:var(--fs-caption)}
  .masthead{gap:10px}
  .legend{gap:6px 12px}
}
@media (max-width:340px){
  .wrap{padding:20px 8px 40px}
  .board{padding:7px 6px 6px}
  .week{border-spacing:2px 3px}
  .corner,.rowhead,.breakhead{width:36px}
  .tile{font-size:var(--fs-caption);min-height:42px}
  .period-night .tile{min-height:36px}
}
@media print{
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .panel{box-shadow:none}
  .clockbox{display:none}
  .dayhead.today .dnow::before{animation:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div>
      <p class="eyebrow"><span class="spark" aria-hidden="true">✧</span>固定周表 · 每周循环</p>
      <h1>一周二十一节</h1>
    </div>
    <div class="clockbox">
      <p class="livetime mono" id="clock">--:--:--</p>
      <p class="today mono" id="dateline"></p>
    </div>
  </header>
  <p class="lede">上午 <span class="mono">07:00–12:00</span> · 下午 <span class="mono">13:00–18:00</span> · 晚上 <span class="mono">19:00–21:00</span>，每天三节；整周固定，<span class="mono">今天</span>高亮。</p>

  <section class="board panel" aria-label="每周课程表">
    <table class="week" id="week">
      <caption class="sr-only">每周固定课程表：周一至周日，每天上午、下午、晚上各一节，共二十一节。</caption>
    </table>
    <div class="legend" id="legend"></div>
    <p class="note">上午 / 下午为大节（5 h），晚上为小节（2 h）· 各科间隔按节数均匀，此表为穷举验证的全局最优。</p>
  </section>
</div>

<script>
/* ---------- the fixed table (穷举最优解，见 repo 历史 / timetable 报告) ---------- */
const DAYS = ["周一","周二","周三","周四","周五","周六","周日"];
const SUBJECTS = [
  {name:"数学", cls:"subj-math",  count:3, hours:15},
  {name:"语文", cls:"subj-fuji",  count:3, hours:15},
  {name:"历史", cls:"subj-honey", count:3, hours:15},
  {name:"政治", cls:"subj-grass", count:3, hours:15},
  {name:"地理", cls:"subj-mint",  count:4, hours:14, tip:"2 大节 + 2 小节"},
  {name:"日语", cls:"subj-coral", count:5, hours:10, tip:"5 小节"},
];
const PERIODS = [
  {name:"上午", time:"07:00–12:00", len:"5 h", night:false,
   cells:["数学","语文","数学","语文","历史","政治","历史"]},
  {name:"下午", time:"13:00–18:00", len:"5 h", night:false,
   cells:["政治","历史","政治","地理","数学","语文","地理"]},
  {name:"晚上", time:"19:00–21:00", len:"2 h", night:true,
   cells:["日语","地理","日语","日语","地理","日语","日语"]},
];
const BREAKS = [   // 放在第 n 个时段之后
  {after:0, name:"午休", text:"12:00–13:00 · 1 h"},
  {after:1, name:"晚休", text:"18:00–19:00 · 1 h"},
];
const SUBJ = Object.fromEntries(SUBJECTS.map(s => [s.name, s]));

/* ---------- render once ---------- */
const week = document.getElementById("week");
let html = '<thead><tr><th class="corner" scope="col"><span class="sr-only">时段</span></th>';
DAYS.forEach((d, i) => {
  html += '<th class="dayhead" scope="col" data-day="' + i + '">' +
          '<span class="dfull">' + d + '</span><span class="dshort">' + d.slice(1) + '</span>' +
          '<span class="dnow">今天</span></th>';
});
html += '</tr></thead><tbody>';
PERIODS.forEach((p, pi) => {
  html += '<tr class="period' + (p.night ? ' period-night' : '') + '">' +
          '<th class="rowhead" scope="row"><span class="pname">' + p.name + '</span>' +
          '<span class="ptime mono">' + p.time + '</span><span class="plen">' + p.len + '</span></th>';
  p.cells.forEach((name, di) => {
    html += '<td class="cell" data-day="' + di + '"><div class="tile ' + SUBJ[name].cls + '">' + name + '</div></td>';
  });
  html += '</tr>';
  const br = BREAKS.find(b => b.after === pi);
  if (br){
    html += '<tr class="breakrow"><th class="breakhead" scope="row"><span>' + br.name + '</span></th>' +
            '<td colspan="7"><div class="breakband mono">' + br.text + '</div></td></tr>';
  }
});
html += '</tbody>';
week.insertAdjacentHTML("beforeend", html);

document.getElementById("legend").innerHTML = SUBJECTS.map(s =>
  '<span class="key"' + (s.tip ? ' title="' + s.tip + '"' : '') + '>' +
  '<span class="dot ' + s.cls + '"></span>' + s.name +
  '<span class="kcount mono">' + s.count + ' 节 · ' + s.hours + ' h</span></span>'
).join("");

const dayHeads = [...week.querySelectorAll(".dayhead")];
const dayCells = DAYS.map((_, i) => [...week.querySelectorAll('.cell[data-day="' + i + '"]')]);

/* ---------- live clock + today highlight ---------- */
const pad = n => String(n).padStart(2, "0");
const WD = ["日","一","二","三","四","五","六"];
const clockEl = document.getElementById("clock");
const dateEl = document.getElementById("dateline");
let shownDay = -1;

function tick(){
  const now = new Date();
  clockEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  dateEl.textContent = pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " 周" + WD[now.getDay()];
  const idx = (now.getDay() + 6) % 7;   // 周一 = 0
  if (idx !== shownDay){
    dayHeads.forEach((h, i) => {
      h.classList.toggle("today", i === idx);
      if (i === idx) h.setAttribute("aria-current", "date");
      else h.removeAttribute("aria-current");
    });
    dayCells.forEach((cells, i) => cells.forEach(c => c.classList.toggle("today", i === idx)));
    shownDay = idx;
  }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
